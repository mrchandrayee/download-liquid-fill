  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Download Button — Liquid Fill Animation",
    "description": "A mesmerizing download button with liquid fill progress animation effect. Pure HTML, CSS & JavaScript.",

<body>
  <main class="page">
    <header class="heading">
      <p class="eyebrow">MICRO-INTERACTION STUDY</p>
      <h1>Download Button</h1>
      <h2>Liquid Fill Animation</h2>
      <p class="intro">Three download controls. One satisfying liquid progress effect.</p>
    </header>

    <section class="demo" aria-label="Download button demos">
      <div class="demo-row">
        <button class="brim brim--primary" data-download="primary" type="button">
          <span class="brim__label">
            <span data-label="idle">Download</span>
            <span data-label="work">Downloading</span>
            <span data-label="done">Open file</span>
          </span>
          <span class="brim__well" aria-hidden="true">
            <span class="brim__liquid"><span class="brim__fill"></span></span>
            <span class="brim__stream"></span>
          </span>
          <svg class="brim__arrow" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 4v18M8 15l8 8 8-8M6 27h20" />
          </svg>
          <svg class="brim__check" viewBox="0 0 32 32" aria-hidden="true"><path d="m6 17 7 7L27 9"/></svg>
        </button>
        <button class="icon-download" data-download="icon" type="button" aria-label="Download file">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v18M8 15l8 8 8-8M6 27h20"/></svg>
        </button>
      </div>

      <div class="demo-row demo-row--second">
        <button class="square-download" data-download="square" type="button" aria-label="Download file">
          <svg class="square-arrow" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v18M8 15l8 8 8-8"/></svg>
          <span class="square-liquid"><span></span></span>
          <svg class="square-check" viewBox="0 0 32 32" aria-hidden="true"><path d="m6 17 7 7L27 9"/></svg>
        </button>
        <button class="brim brim--dark" data-download="wide" type="button">
          <span class="brim__label">
            <span data-label="idle">Download</span>
            <span data-label="work">Downloading</span>
            <span data-label="done">Open file</span>
          </span>
          <span class="brim__well" aria-hidden="true">
            <span class="brim__liquid"><span class="brim__fill"></span></span>
            <span class="brim__stream"></span>
          </span>
          <svg class="brim__arrow" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v18M8 15l8 8 8-8M6 27h20"/></svg>
          <svg class="brim__check" viewBox="0 0 32 32" aria-hidden="true"><path d="m6 17 7 7L27 9"/></svg>
        </button>
      </div>
      <p class="hint" id="hint" aria-live="polite">Click any button to replay the liquid fill.</p>
    </section>

    <footer>HTML <span>·</span> CSS <span>·</span> JavaScript <span>—</span> No libraries required</footer>
  </main>
  <script src="app.js"></script>
</body>
